<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To-Do List - LocalStorage</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>To-Do List</h1>
      <p class="subtitle">Quản lý công việc cá nhân — Lưu bằng LocalStorage</p>
    </header>

    <!-- Form thêm / sửa -->
    <section class="form-section">
      <form id="taskForm">
        <input type="hidden" id="taskId" value="" />
        <div class="row">
          <input id="title" type="text" placeholder="Tên công việc" required />
          <input id="dueDate" type="date" />
        </div>
        <div class="row">
          <textarea id="description" rows="2" placeholder="Mô tả (tùy chọn)"></textarea>
        </div>
        <div class="row actions">
          <button id="saveBtn" type="submit">Thêm việc</button>
          <button id="clearBtn" type="button" class="secondary">Xóa form</button>
        </div>
      </form>
    </section>

    <!-- Tìm kiếm & lọc -->
    <section class="filter-section">
      <input id="searchInput" type="search" placeholder="Tìm kiếm theo tên hoặc mô tả..." />
      <select id="filterSelect">
        <option value="all">Tất cả</option>
        <option value="active">Chưa hoàn thành</option>
        <option value="completed">Hoàn thành</option>
      </select>
      <select id="sortSelect">
        <option value="created_desc">Mới nhất</option>
        <option value="created_asc">Cũ nhất</option>
        <option value="due_asc">Hạn sớm nhất</option>
        <option value="due_desc">Hạn muộn nhất</option>
      </select>
    </section>

    <!-- Danh sách tasks -->
    <section class="list-section">
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyMsg" class="empty">Chưa có công việc nào. Thêm việc vào nhé!</div>
    </section>

    <footer>
      <small>Đồ án: To-Do List — Lưu LocalStorage • Vũ Xuân Tuấn</small>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
